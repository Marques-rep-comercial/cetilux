function winAnsiBytes(text){
  const map={
    '€':0x80,'‚':0x82,'ƒ':0x83,'„':0x84,'…':0x85,'†':0x86,'‡':0x87,'ˆ':0x88,'‰':0x89,'Š':0x8A,'‹':0x8B,'Œ':0x8C,'Ž':0x8E,'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'•':0x95,'–':0x96,'—':0x97,'˜':0x98,'™':0x99,'š':0x9A,'›':0x9B,'œ':0x9C,'ž':0x9E,'Ÿ':0x9F,
    'À':0xC0,'Á':0xC1,'Â':0xC2,'Ã':0xC3,'Ä':0xC4,'Å':0xC5,'Æ':0xC6,'Ç':0xC7,'È':0xC8,'É':0xC9,'Ê':0xCA,'Ë':0xCB,'Ì':0xCC,'Í':0xCD,'Î':0xCE,'Ï':0xCF,'Ð':0xD0,'Ñ':0xD1,'Ò':0xD2,'Ó':0xD3,'Ô':0xD4,'Õ':0xD5,'Ö':0xD6,'×':0xD7,'Ø':0xD8,'Ù':0xD9,'Ú':0xDA,'Û':0xDB,'Ü':0xDC,'Ý':0xDD,'Þ':0xDE,'ß':0xDF,
    'à':0xE0,'á':0xE1,'â':0xE2,'ã':0xE3,'ä':0xE4,'å':0xE5,'æ':0xE6,'ç':0xE7,'è':0xE8,'é':0xE9,'ê':0xEA,'ë':0xEB,'ì':0xEC,'í':0xED,'î':0xEE,'ï':0xEF,'ð':0xF0,'ñ':0xF1,'ò':0xF2,'ó':0xF3,'ô':0xF4,'õ':0xF5,'ö':0xF6,'÷':0xF7,'ø':0xF8,'ù':0xF9,'ú':0xFA,'û':0xFB,'ü':0xFC,'ý':0xFD,'þ':0xFE,'ÿ':0xFF,
    '¹':0xB9,'²':0xB2,'³':0xB3,'º':0xBA,'ª':0xAA,'°':0xB0,'±':0xB1,'µ':0xB5,'¢':0xA2,'£':0xA3,'¥':0xA5,'§':0xA7,'©':0xA9,'®':0xAE
  };
  const out=[];
  for(const ch of String(text??'')){
    const c=ch.charCodeAt(0);
    if(c<=255) out.push(c);
    else if(map[ch]!=null) out.push(map[ch]);
    else if(ch==='→') out.push(0x2D,0x3E);
    else if(ch==='·' || ch==='•') out.push(0x2E);
    else if(ch==='−') out.push(0x2D);
    else out.push(0x3F);
  }
  return out;
}

  return s;
}
